services:
  db:
    image: postgres:16-alpine
    container_name: ner-dementia-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ner_dementia_care
    ports:
      - "5432:5432"
    volumes:
      - ner_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ner_dementia_care"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ner_pgdata:
